---
exp_id: "llama1b_all_r16_harmful"
random_state: 5
device: "cuda"
#base model
base_model_path: "meta-llama/Llama-3.2-1B-Instruct"
dtype: "bfloat16"
max_seq_length: 8192 #context
attn_implementation: "flash_attention_3" #flash_attention_3, flash_attention_2, eager
use_liger_kernel: false
use_packing: false
#peft model
target_modules:
   - "q_proj"
   - "k_proj"
   - "v_proj"
   - "o_proj"
   - "gate_proj"
   - "up_proj"
   - "down_proj"
lora_alpha: 16
lora_dropout: 0.05
lora_rank: 16
rs: 32 #safety rank for SVD of safe activations
ds: 32 #task rank for SVD of task activations
use_gradient_checkpointing: true
#finetuning data
data_path: "/content/drive/MyDrive/CAISI_phase2/safe-finetuning/ft_datasets/circuit_breakers"
data_template: "alpaca" #alpaca or dolly
#SFT Trainer
per_device_train_batch_size: 8
per_device_eval_batch_size: 8
gradient_accumulation_steps: 2
max_grad_norm: 1.0
warmup_ratio: 0.05
lr_scheduler_type: "linear"
num_train_epochs: 5
learning_rate: 0.0002
save_strategy: "epoch"
eval_strategy: "epoch"
save_only_model: False
optim: "adamw_torch_fused"
weight_decay: 0.01
logging_strategy: "steps"
logging_steps: 10